<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me הבוט · שיחות ולידים</title>
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><meta name="apple-mobile-web-app-title" content="לידים"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#E5133A"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--red:#E5133A;--red-d:#B80D2D;--red-t:#FFE9ED;--ink:#1D1D2B;--mut:#77768A;--line:#ECEAF0;--bg:#FAF9FB;--panel:#fff;--ok:#0E9F6E;--ok-t:#E3F6EE;--wa:#1FAF55;
  --disp:"Secular One","Assistant",sans-serif;--body:"Assistant","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #FF8AA0;outline-offset:2px;border-radius:8px}
.demo{background:#FFF4CC;color:#6B5200;text-align:center;padding:5px;font-size:13px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{width:38px;height:38px;border-radius:9px;background:var(--red);color:#fff;font:22px/38px var(--disp);text-align:center;letter-spacing:-.5px;flex:none}
.top h1{font:22px/1 var(--disp);margin:0;font-weight:400}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;margin-inline-start:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(14,159,110,.5);animation:pulse 2.4s infinite}
.live.err i{background:var(--red);animation:none}
.live.err{color:var(--red-d)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(14,159,110,0)}100%{box-shadow:0 0 0 0 rgba(14,159,110,0)}}
.sp{flex:1}
.search{width:min(320px,40vw);border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.search:focus{background:#fff;border-color:#D9D6E0;outline:none}
.refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.refresh svg{width:16px;height:16px;transition:transform .5s}
.refresh.spin svg{transform:rotate(-360deg)}

/* day strip: the signature */
.day{padding:18px 26px 6px}
.day-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.day-h h2{font:30px/1.1 var(--disp);margin:0;font-weight:400}
.day-h .facts{color:var(--mut);font-size:14px}
.day-h .facts b{color:var(--ink);font-weight:800}
.strip{position:relative;display:grid;grid-template-columns:repeat(24,1fr);margin-top:14px;height:64px;border-bottom:2px solid var(--ink)}
.hr{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding-bottom:5px;border-right:1px dashed #E6E3EA}
.hr:first-child{border-right:0}
.hr span{position:absolute;bottom:-22px;font-size:11px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:#C9C6D1;border:0;padding:0;cursor:pointer;flex:none}
.dot.ph{background:var(--red);width:12px;height:12px}
.dot.cart{background:var(--ok)}
.dot:hover{transform:scale(1.35)}
.now{position:absolute;top:0;bottom:-2px;width:2px;background:var(--red);pointer-events:none}
.now:after{content:"עכשיו";position:absolute;top:-2px;right:5px;font-size:11px;color:var(--red);font-weight:700;white-space:nowrap}
.legend{display:flex;gap:16px;justify-content:flex-start;margin-top:28px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:0}

/* main grid */
.main{display:grid;grid-template-columns:minmax(330px,400px) 1fr minmax(250px,300px);gap:22px;padding:14px 26px 30px;align-items:start}
.col h3{font:18px/1.2 var(--disp);font-weight:400;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.cnt{font:700 12px/1 var(--body);background:var(--red);color:#fff;border-radius:999px;padding:4px 8px}
.cnt.z{background:#E7E5EC;color:var(--mut)}

/* call queue */
.queue{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.tk{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--red);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start;width:100%}
.tk.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--red-t)}
.tk-top{display:flex;align-items:baseline;gap:8px}
.tk-ph{font:21px/1.1 var(--disp);direction:ltr;unicode-bidi:isolate}
.tk-nm{font-weight:700;color:var(--mut)}
.wait{margin-inline-start:auto;font-weight:800;font-size:13px;color:var(--red-d);white-space:nowrap}
.wait.old{background:var(--red);color:#fff;border-radius:6px;padding:1px 7px}
.tk-what{margin-top:3px;color:#45445A}
.tk-acts{display:flex;gap:8px;margin-top:10px}
.a{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:8px 13px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}
.a svg{width:16px;height:16px}
.a.wa{background:var(--wa);color:#fff}.a.call{background:var(--ink);color:#fff}.a.done{background:#F1F0F4;color:var(--ink)}.a.done.on{background:var(--ok-t);color:var(--ok)}
.calm{background:var(--panel);border:1px dashed #DAD7E1;border-radius:12px;padding:18px;color:var(--mut);text-align:center}

/* all list */
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover{background:#FBFAFD}
.it.sel{background:var(--red-t)}
.it .d{width:9px;height:9px;border-radius:50%;background:#C9C6D1;grid-row:span 2}
.it .d.ph{background:var(--red)}.it .d.cart{background:var(--ok)}
.it .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .w{font-size:12px;color:var(--mut);white-space:nowrap}
.it .m{grid-column:2/-1;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;width:100%;border:0;background:#FBFAFD;padding:10px;font-weight:700;color:var(--mut);cursor:pointer}

/* reader */
.reader{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:420px;position:sticky;top:84px;max-height:calc(100vh - 104px);display:flex;flex-direction:column}
.r-head{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.r-who{font:26px/1.1 var(--disp);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.r-who .ph{direction:ltr;unicode-bidi:isolate}
.r-meta{color:var(--mut);font-size:13.5px;margin-top:4px}
.r-meta bdi{direction:ltr}
.r-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13.5px}
.pill b{font-weight:800}
.pill.cart{background:var(--ok-t);border-color:#BFE8D6;color:#0A6E4C}
.r-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chat{padding:18px 22px 24px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.b{max-width:80%;padding:8px 13px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.b.bot{background:#F3F2F6;align-self:flex-start;border-start-start-radius:4px}
.b.me{background:var(--ink);color:#fff;align-self:flex-end;border-start-end-radius:4px}
.b.miss{box-shadow:inset 0 0 0 2px #FFC2CE}
.prod{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:7px;padding:1px 7px;margin:3px 0 0 4px;font-size:13.5px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);padding:40px;text-align:center}

/* brain */
.brain section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.brain h4{margin:0 0 10px;font-size:14.5px;font-weight:800}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:9px;font-size:14px}
.bar .tr{grid-column:1/-1;height:7px;border-radius:4px;background:#F1F0F4;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar:first-of-type .tr i{background:var(--red)}
.bar small{color:var(--mut)}
.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.funnel div{background:var(--bg);border-radius:9px;padding:8px 4px}
.funnel b{display:block;font:22px/1.1 var(--disp);font-weight:400}
.funnel span{font-size:12px;color:var(--mut)}
.q{font-size:14px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.q:first-of-type{border-top:0}
.q:hover{color:var(--red-d)}
.hint{color:var(--mut);font-size:13px}
kbd{font:12px var(--body);background:#F1F0F4;border-radius:4px;padding:1px 5px}


/* by day */
.dk{margin:8px 26px 4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px}
.dk-h{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.dk-h h2{font:20px/1.1 var(--disp);font-weight:400;margin:0}
.dk-sum{color:var(--mut);font-size:14px}
.dk-sum b{color:var(--ink);font-weight:800}
.dk-rng{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.dk-rng button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer}
.dk-rng button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dk-rng label{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mut)}
.dk-rng input{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);font-size:13px;min-width:0}
.dk-chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:18px;padding-top:18px;border-bottom:2px solid var(--ink)}
.dk-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer;position:relative;border-radius:6px 6px 0 0}
.dk-col:hover{background:#F6F5F9}
.dk-col.sel{background:var(--red-t)}
.dk-n{font-size:11.5px;font-weight:800;color:var(--ink);line-height:1;margin-bottom:3px;white-space:nowrap}
.dk-n.z{color:#C9C6D1;font-weight:600}
.dk-bar{width:min(70%,26px);background:#D9D6E0;border-radius:4px 4px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:0}
.dk-lead{background:var(--red);width:100%}
.dk-x{display:flex;gap:4px;margin-top:5px}
.dk-x span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:visible}
.dk-x span.t{color:var(--red-d);font-weight:800}
.dk-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.dk-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.dk-tw{margin-top:14px;max-width:760px;max-height:286px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.dk-t{width:100%;border-collapse:collapse;font-size:14px}
.dk-t th{position:sticky;top:0;background:#FBFAFD;text-align:start;font-weight:800;font-size:12.5px;color:var(--mut);padding:8px 12px;border-bottom:1px solid var(--line)}
.dk-t td{padding:7px 12px;border-bottom:1px solid var(--line)}
.dk-t tr:last-child td{border-bottom:0}
.dk-t td.num,.dk-t th.num{text-align:center;font-variant-numeric:tabular-nums}
.dk-t tbody tr{cursor:pointer}
.dk-t tbody tr:hover{background:#FBFAFD}
.dk-t tbody tr.sel{background:var(--red-t)}
.dk-t tbody tr.z td{color:#AAA8B8}
.dk-t td.ph b{color:var(--red-d)}
.dk-chip{scroll-margin-top:96px;display:flex;align-items:center;gap:8px;background:var(--red-t);color:var(--red-d);border-radius:10px;padding:7px 10px;margin-bottom:8px;font-weight:700;font-size:13.5px}
.dk-chip button{margin-inline-start:auto;border:0;background:#fff;color:var(--red-d);border-radius:7px;padding:3px 9px;font-weight:800;cursor:pointer}
@media(max-width:760px){
  .dk{margin:8px 14px 4px;padding:14px 12px 12px}.dk-rng{margin:0;width:100%}.dk-rng label{flex:1}.dk-rng input{flex:1;width:100%}
  .dk-chart{gap:2px;height:130px}.dk-x{gap:2px}.dk-n{font-size:10px}
  .dk-chart.dense .dk-n{display:none}
}

@media(max-width:1180px){.main{grid-template-columns:minmax(300px,380px) 1fr}.brain{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.brain section{margin:0}}
@media(max-width:760px){
  .top{padding:12px 14px;flex-wrap:wrap;row-gap:8px}.top h1{font-size:19px}.live{order:6;margin:0}.search{order:5;width:100%}
  .day{padding:14px 14px 4px}.day-h h2{font-size:24px}.strip{height:60px}.hr:nth-child(odd) span{display:none}
  .main{grid-template-columns:1fr;padding:12px 14px 24px}.reader{position:static;max-height:none}.brain{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>תצוגה לדוגמה עם נתונים מומצאים. בדשבורד האמיתי יופיעו השיחות מהאתר.</div>
<header class="top">
  <div class="logo" aria-hidden="true">ME</div>
  <h1>הבוט: שיחות ולידים</h1>
  <span class="live" id="live"><i></i><span id="upd">מחובר</span></span>
  <span class="sp"></span>
  <input class="search" id="q" type="search" placeholder="חיפוש טלפון, דגם או קטגוריה" aria-label="חיפוש">
  <button class="refresh" id="ref" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>רענון</button>
</header>

<section class="day" aria-label="היום לפי שעות">
  <div class="day-h"><h2 id="dayTitle">היום</h2><span class="facts" id="dayFacts"></span></div>
  <div class="strip" id="strip"></div>
  <div class="legend"><span><i style="background:var(--red)"></i>השאירו טלפון</span><span><i style="background:var(--ok)"></i>הוסיפו לסל</span><span><i style="background:#C9C6D1"></i>שיחה בלבד</span></div>
</section>

<section class="dk" id="dk" aria-labelledby="dkH">
  <div class="dk-h">
    <h2 id="dkH">לפי ימים</h2>
    <span class="dk-sum" id="dkSum"></span>
    <div class="dk-rng" role="group" aria-label="טווח תאריכים">
      <button type="button" data-r="14" class="on">14 יום</button>
      <button type="button" data-r="30">30 יום</button>
      <label>מ-<input type="date" id="dkFrom" aria-label="מתאריך"></label>
      <label>עד <input type="date" id="dkTo" aria-label="עד תאריך"></label>
    </div>
  </div>
  <div class="dk-chart" id="dkChart"></div>
  <div class="dk-x" id="dkX" aria-hidden="true"></div>
  <div class="dk-legend"><span><i style="background:#D9D6E0"></i>שיחות</span><span><i style="background:var(--red)"></i>מהן השאירו טלפון</span><span>לחצו על יום כדי לראות את השיחות שלו</span></div>
  <div class="dk-tw"><table class="dk-t"><thead><tr><th>יום</th><th class="num">שיחות</th><th class="num">השאירו טלפון</th><th class="num">אחוז</th></tr></thead><tbody id="dkBody"></tbody></table></div>
</section>

<main class="main">
  <div class="col">
    <h3>לחזור אליהם <span class="cnt" id="qc">0</span></h3>
    <div class="queue" id="queue"></div>
    <h3>השיחות בטווח</h3>
    <div class="tabs" id="tabs">
      <button type="button" data-f="all" class="on">הכול</button>
      <button type="button" data-f="phone">עם טלפון</button>
      <button type="button" data-f="cart">הוסיפו לסל</button>
      <button type="button" data-f="done">טופלו</button>
    </div>
    <div id="dkChip"></div>
    <div class="list" id="items"></div>
  </div>
  <article class="reader" id="det" aria-live="polite"><div class="empty">בחרו שיחה כדי לקרוא אותה</div></article>
  <aside class="brain" id="brain"></aside>
</main>

<script>
var BOOT=null, API='https://script.google.com/macros/s/AKfycbza6BZjw3xMxWigCGlW6fgElp5DnhbFwW0YG7GttMcOx7Nm2Rhya1gshtMUcJZambSn/exec';
/* המפתח מגיע בקישור (#k=...), נשמר בדפדפן ונמחק מהכתובת */
var KEY=(function(){var m=(location.hash+location.search).match(/[#&?]k=([0-9a-f]{32})/);try{if(m){localStorage.setItem('melk',m[1]);history.replaceState(null,'',location.pathname);return m[1]}return localStorage.getItem('melk')||''}catch(e){return m?m[1]:''}})();
var DEMO=/[?&]demo=1/.test(location.search);
function api(q){return fetch(API+'?leads=1&k='+KEY+(q||''),{cache:'no-store'}).then(function(r){return r.json()})}
var live=!!KEY&&!DEMO, rows=[], f='all', sel=null, limit=40, lastOk=0, runBroken=false, lastAct=Date.now(), seenLeads=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mins(t){return Math.max(0,Math.round((Date.now()-new Date(t))/6e4))}
function ago(t){var m=mins(t);if(m<1)return'עכשיו';if(m<60)return'לפני '+m+' דק׳';var h=Math.floor(m/60);if(h<24)return'לפני '+h+' שע׳';var d=new Date(t);return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function waitTxt(t){var m=mins(t);if(m<60)return'מחכה '+m+' דק׳';var h=Math.floor(m/60);return h<24?'מחכה '+h+' שע׳':'מחכה '+Math.floor(h/24)+' ימים'}
function intl(p){p=String(p).replace(/\D/g,'');return p.indexOf('0')===0?'972'+p.slice(1):p}
function fmtPh(p){p=String(p||'').replace(/\D/g,'');if(/^5\d{8}$/.test(p))p='0'+p;return p.length===10?p.slice(0,3)+'-'+p.slice(3):p}
function isToday(t){var d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()}
function lines(r){return String(r.log||'').split('\n').filter(Boolean)}
var MISS=/לא בטוח שהבנתי|לא הבנתי/;
function misses(r){var L=lines(r),out=[];for(var i=1;i<L.length;i++)if(/^בוט:/.test(L[i])&&MISS.test(L[i])&&/^לקוח:/.test(L[i-1]))out.push(L[i-1].replace(/^לקוח:\s*/,''));return out}
function what(r){var a=[r.cat,r.budget,r.size].filter(Boolean);return a.length?a.join(', '):'עוד לא בחר קטגוריה'}
